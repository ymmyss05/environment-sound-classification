[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "audio-classify"
version = "1.0.0"
description = "Environmental Sound Classification using ResNet18 + Mel Spectrogram"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
record = ["sounddevice>=0.4.6"]
ffmpeg = ["imageio-ffmpeg>=0.4.9"]

[tool.setuptools]
packages = ["model", "preprocess", "train", "test", "utils"]
